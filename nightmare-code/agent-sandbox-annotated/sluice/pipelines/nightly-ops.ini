# =============================================================================
# pipelines/nightly-ops.ini - the nightly maintenance cycle of a web host
# =============================================================================
#
#                    +-> host-facts -----------------+
#                    +-> log-insights ---------------+
#   preflight -------+-> ssh-audit ------------------+--> report --+-> publish
#                    +-> fs-audit -------------------+             +-> notify
#                    +-> cert-expiry ----------------+
#                    +-> backup --> backup-verify ---+
#
# Keys per [job NAME]:
#   run            script (relative to the install dir) or command, plus args
#   needs          jobs that must finish first (comma or space separated)
#   timeout        per attempt: 90, 30s, 5m, 1h (0 or absent = no limit)
#   retries        extra attempts after a failure or timeout (0-10)
#   retry_delay    base delay of the jittered exponential backoff
#   when           success (default) | always (run even after failures)
#   allow_failure  a failure is reported but neither blocks dependents nor
#                  fails the run
#   description    shown by `sluice plan` and in graph tooltips
# =============================================================================

[pipeline]
name         = nightly-ops
description  = Nightly host health, security posture and data-protection cycle
max_parallel = 4
fail_fast    = false

# Defaults for stage inputs. A variable that is already set - in the
# environment or in .env - always wins over these values. ${SLUICE_WORKSPACE}
# defaults to var/workspace (var/demo for `sluice demo`).
[env]
SLUICE_ACCESS_LOGS    = ${SLUICE_WORKSPACE}/logs/access.log*
SLUICE_SSHD_CONFIG    = ${SLUICE_WORKSPACE}/ssh/sshd_config
SLUICE_FS_AUDIT_PATHS = ${SLUICE_WORKSPACE}/srv
SLUICE_CERT_PATHS     = ${SLUICE_WORKSPACE}/certs/*.pem
SLUICE_BACKUP_SOURCES = ${SLUICE_WORKSPACE}/data ${SLUICE_WORKSPACE}/srv/app/config
SLUICE_BACKUP_DIR     = ${SLUICE_WORKSPACE}/backups
SLUICE_PUBLISH_ROOT   = ${SLUICE_WORKSPACE}/www

[job preflight]
description = Toolchain, permissions and free-space checks
run         = stages/preflight.sh
timeout     = 30s

[job host-facts]
description = Host inventory: OS, CPU, memory, load, disks, addresses
needs       = preflight
run         = stages/host-facts.sh
timeout     = 30s

[job log-insights]
description = Traffic, error-rate and latency analytics of the access logs
needs       = preflight
run         = stages/log-insights.sh
timeout     = 5m

[job ssh-audit]
description = OpenSSH server hardening audit
needs       = preflight
run         = stages/ssh-audit.sh
timeout     = 30s

[job fs-audit]
description = World-writable, setuid and exposed-secret file scan
needs       = preflight
run         = stages/fs-audit.sh
timeout     = 10m

# Certificate checks may hit remote endpoints: retry transient failures.
[job cert-expiry]
description = TLS certificate expiry for files and endpoints
needs       = preflight
run         = stages/cert-expiry.sh
timeout     = 1m
retries     = 2
retry_delay = 2s

[job backup]
description = Checksummed archive with grandfather-father-son retention
needs       = preflight
run         = stages/backup.sh
timeout     = 30m

[job backup-verify]
description = Restore the new archive and verify every file
needs       = backup
run         = stages/backup-verify.sh
timeout     = 30m

# `when = always`: the report is produced even when upstream jobs failed.
[job report]
description = Markdown, JSON and HTML report of the whole run
needs       = host-facts, log-insights, ssh-audit, fs-audit, cert-expiry, backup-verify
run         = stages/report.sh
when        = always
timeout     = 1m

[job publish]
description = Atomic release of the HTML report to the web root
needs       = report
run         = stages/publish.sh
timeout     = 1m

# Chat outages must not turn a healthy night red: allow_failure.
[job notify]
description = Webhook notification (Slack-compatible)
needs       = report
run         = stages/notify.sh
when        = always
allow_failure = true
timeout     = 2m
